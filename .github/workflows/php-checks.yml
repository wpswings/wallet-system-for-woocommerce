name: PHP Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Collect changed PHP files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -n "$BASE" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.php' > changed-files.txt
          else
            # Manual run: scan the whole plugin.
            echo "." > changed-files.txt
          fi

          echo "Files to check:"
          cat changed-files.txt
          if [ -s changed-files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      # Report-only: violations are reported but never fail the job.
      - name: Run PHPCS
        if: steps.files.outputs.has_files == 'true'
        run: |
          vendor/bin/phpcs --standard=phpcs.xml.dist -q \
            --file-list=changed-files.txt \
            --report-full=./phpcs-report.txt \
            --report-summary=./phpcs-summary.txt \
            --report-checkstyle=./phpcs-report.xml || true
          cat ./phpcs-report.txt 2>/dev/null || true

      - name: Annotate PR with PHPCS results
        if: always() && steps.files.outputs.has_files == 'true' && hashFiles('phpcs-report.xml') != ''
        run: cs2pr ./phpcs-report.xml --graceful-warnings || true

      - name: Write PHPCS job summary
        if: always() && steps.files.outputs.has_files == 'true'
        run: |
          {
            echo "## PHPCS (WordPress Coding Standards) report"
            echo
            echo "> Report only: this check does not fail the build."
            echo
            if [ -s phpcs-summary.txt ]; then
              echo '```'
              cat phpcs-summary.txt
              echo '```'
              echo
              echo "<details><summary>Full report</summary>"
              echo
              echo '```'
              head -c 900000 phpcs-report.txt
              echo '```'
              echo "</details>"
            else
              echo "No PHPCS violations found in changed files. :white_check_mark:"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PHPCS report
        if: always() && steps.files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: |
            phpcs-report.txt
            phpcs-summary.txt
            phpcs-report.xml
            changed-files.txt
          if-no-files-found: ignore

  php-compatibility:
    name: PHP compatibility (7.4+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      # Report-only: violations are reported but never fail the job.
      - name: Run PHPCompatibilityWP
        run: |
          vendor/bin/phpcs . \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 7.4- \
            --extensions=php \
            --ignore=*/vendor/*,*/node_modules/*,*/package/lib/*,*/build/*,*/pos-app/* \
            -s \
            --report-full=./phpcompat-report.txt \
            --report-summary=./phpcompat-summary.txt \
            --report-checkstyle=./phpcompat-report.xml || true
          cat ./phpcompat-report.txt 2>/dev/null || true

      - name: Annotate PR with compatibility results
        if: always() && hashFiles('phpcompat-report.xml') != ''
        run: cs2pr ./phpcompat-report.xml --graceful-warnings || true

      - name: Write compatibility job summary
        if: always()
        run: |
          {
            echo "## PHP compatibility (7.4+) report"
            echo
            echo "> Report only: this check does not fail the build."
            echo
            if [ -s phpcompat-summary.txt ]; then
              echo '```'
              cat phpcompat-summary.txt
              echo '```'
              echo
              echo "<details><summary>Full report</summary>"
              echo
              echo '```'
              head -c 900000 phpcompat-report.txt
              echo '```'
              echo "</details>"
            else
              echo "No PHP compatibility issues found. :white_check_mark:"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcompat-report
          path: |
            phpcompat-report.txt
            phpcompat-summary.txt
            phpcompat-report.xml
          if-no-files-found: ignore

  php-lint:
    name: PHP ${{ matrix.php }} syntax lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './package/lib/*' \
            -print0 | xargs -0 -n1 -P4 php -l > lint.log 2>&1 || true
          if grep -E 'Parse error|Fatal error|Errors parsing' lint.log; then
            exit 1
          fi
          echo "No syntax errors on PHP ${{ matrix.php }}."
